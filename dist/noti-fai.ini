# noti-fai settings. Changes apply to the next ball.

# Sound when a ball drops:
#   default  the Windows notification sound (follows your sound settings)
#   none     no sound
#   a path   your own .wav file, e.g. sound=C:\Sounds\ding.wav
# Balls from desktop apps (Claude, ChatGPT, ...) stay quiet either way:
# their own Windows notification already makes a sound.
sound=default
